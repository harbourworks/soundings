# Publishes the package to npm when a version tag (v1.2.3) is pushed.
# Uses npm trusted publishing: GitHub's OIDC identity, no token stored anywhere, and npm
# adds provenance automatically. It needs a one-time setting on npmjs.com (package settings,
# Trusted publisher: GitHub Actions, harbourworks/<repo>, publish.yml, environment npm).
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@11
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then echo "::error::Tag $TAG doesn't match package.json ($version)"; exit 1; fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish
        run: npm publish --provenance --access public
